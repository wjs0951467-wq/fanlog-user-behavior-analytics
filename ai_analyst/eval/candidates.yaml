# FANLOG 평가 후보 질문 초안 (40문항)
#
# 이 초안은 정답이 아니다. 사람이 DBeaver 로 직접 확인해야 verified 가 된다.
# 모델이 낸 SQL 이나 숫자로 정답을 만들지 않는다.
#
# - 작성: Claude Code 가 semantic/schema_profile.json 과 semantic_layer.yaml 만 보고 썼다. DB 에서 실행해 보지 않았다.
#   그래서 정답 값은 어디에도 적지 않았다 (reference_note 는 "왜 이 SQL 인가"의 추론만 담는다).
# - 이 질문들은 모델에 한 번도 물어보지 않았다. 보류(heldout) 질문으로 쓰려면 그 상태를 지켜야 한다.
# - 확인 절차: eval/verify/reference_queries.sql 을 DBeaver 에서 한 문항씩 실행하고 eval/verify/VERIFY_CHECKLIST.md 에 결과를 적는다.
#   확인이 끝난 문항만 questions.yaml 로 옮기고 verified: true 로 바꾼다.
# - needs_definition: true 인 문항은 지표 정의가 확정되지 않았다. 정의를 사람이 정하기 전에는 보류 후보가 아니다 (heldout_candidate: false).
# - guard_ok: reference_sql 이 app.sql_guard.validate_sql 을 통과하는가 (파싱 검사만, tests/test_eval_candidates.py 가 확인한다).
# - 필드: id, question, category, expected_kind(scalar|rows|refusal), reference_sql, reference_note, trap, likely_wrong,
#   tolerance, ordered, needs_definition, heldout_candidate, guard_ok, verified, source

