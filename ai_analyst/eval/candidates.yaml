      ORDER BY quantity DESC
    reference_note: "수량은 fact_order_item.quantity 이고, '결제가 끝나지 않은 주문'은 status = 'pending' 이다(purchase_count 와 같은 기준). 환불된 주문은 질문이 빼라고 하지 않았으므로 포함한다."
    trap: "pending 제외 조건과 수량 합계(SUM)가 동시에 필요하다. 행 수(COUNT)로 세면 수량이 2 이상인 줄에서 틀린다."
    likely_wrong: "COUNT(*) 로 주문 상세 줄 수를 세거나, fact_order 를 조인하지 않아 pending 을 포함한다."
