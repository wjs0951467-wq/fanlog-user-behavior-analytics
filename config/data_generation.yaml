# FANLOG 가상 데이터 생성 설정
# 이 파일은 src/generation/ 스크립트가 읽어들이는 단일 설정 기준이다.
# PRD 13절, data_dictionary.md 기준으로 작성되었다.
# v1.2: activity_intensity_levels 빈도를 상향 조정하여 scale.artist_activities(300~700) 목표와 정합시킴

meta:
  project_name: fanlog-user-behavior-analytics
  config_version: 1.2
  random_seed: 20260923
  analysis_period_days: 90
  analysis_start_date: "2026-01-01"  # KST 기준, 실행 시 조정 가능
  timezone_storage: UTC
  timezone_display: Asia/Seoul
  reproducibility_check: >
    동일한 random_seed로 재실행 시 모든 산출 테이블의 행 수·값이 완전히
    동일해야 한다. 이 검증은 tests/에서 별도 스크립트로 수행한다.

scale:
  # PRD 13.1 목표 범위. 실제 생성 결과는 스크립트 실행 로그에 별도 기록한다.
  users:
    min: 1500
    max: 2000
  artists:
    count: 3
  content:
    min: 100
    max: 150
  artist_activities:
    min: 300
    max: 700
  user_events:
    min: 80000
    max: 150000
  products:
    min: 30
    max: 50
  orders:
    min: 1000
    max: 2500

artists:
  # 아티스트별로 다른 활동 패턴을 부여하기 위한 목록. 이름은 전부 가상이다.
  - artist_id: artist_001
    artist_name: "가상아티스트A"
    artist_type: group
    debut_year: 2021
    activity_intensity: high
  - artist_id: artist_002
    artist_name: "가상아티스트B"
    artist_type: group
    debut_year: 2019
    activity_intensity: medium
  - artist_id: artist_003
    artist_name: "가상아티스트C"
    artist_type: solo
    debut_year: 2023
    activity_intensity: low

activity_intensity_levels:
  # activity_intensity 값이 실제로 의미하는 발생 빈도. "일상 활동기(daily)"
  # 기준값이며, 다른 활동 단계에서는 activity_phases.phase_multiplier로
  # 이 값을 조정한다.
  high:
    posts_per_week: [8, 10]
    messages_per_week: [6, 8]
    live_per_month: [6, 8]
  medium:
    posts_per_week: [4, 6]
    messages_per_week: [3, 5]
    live_per_month: [3, 5]
  low:
    posts_per_week: [2, 3]
    messages_per_week: [1, 2]
    live_per_month: [1, 2]

activity_phases:
  # PRD 13.2
  phase_types:
    - daily
    - comeback_prep
    - comeback_active
    - tour
    - inactive
  duration_weight:
    # 합계는 반드시 1.0이어야 한다. 아티스트별 90일을 이 비율로 나눠 배정한다.
    daily: 0.45
    comeback_prep: 0.10
    comeback_active: 0.15
    tour: 0.10
    inactive: 0.20
  assignment_method: >
    아티스트마다 analysis_period_days(90일)를 duration_weight 비율로 나눈
    연속 구간(segment)들을 만들고, 이 구간들의 순서를 무작위로 섞어 이어붙여서
    90일 전체를 빈틈이나 겹침 없이 정확히 채운다. 각 구간의 길이는
    반올림 오차를 마지막 구간에서 보정하여 합이 정확히 90일이 되도록 한다.
  phase_multiplier:
    # activity_intensity_levels의 기준값(daily 활동기 기준)에 곱하는 배수
    daily: 1.0
    comeback_prep: 1.3
    comeback_active: 1.8
    tour: 1.2
    inactive: 0.2

content_types:
  # PRD 6.1.1과 동일한 5개 값
  distribution:
    notice: 0.25
    photo: 0.30
    video: 0.25
    music_video: 0.10
    live_replay: 0.10

fan_behavior:
  # PRD 13.3. 이 값들은 생성 단계에서만 사용하는 잠재 성향이며,
  # 어떤 분석 테이블에도 직접 저장하지 않는다. 팬 세그먼트(PRD 11장)는
  # 이 잠재값이 아니라 실제로 생성된 행동 이벤트를 집계해 다시 계산한다.
  visit_frequency_profile:
    distribution: beta
    alpha: 2
    beta: 5
    description: "0~1 사이 값. 높을수록 자주 방문"
  engagement_propensity_profile:
    distribution: beta
    alpha: 2
    beta: 6
  purchase_propensity_profile:
    distribution: beta
    alpha: 1.5
    beta: 8
  preferred_channel:
    values: [content, message, live]
  selection_bias:
    strength: 0.3   # 0 = 편향 없음, 1 = 매우 강한 편향
  noise:
    response_noise_std: 0.15

commerce:
  currency: KRW
  product_types:
    distribution:
      album: 0.35
      lightstick: 0.15
      apparel: 0.30
      collab: 0.20
  refund_rate_target: 0.05
  price_range_krw:
    album: [15000, 35000]
    lightstick: [40000, 60000]
    apparel: [20000, 80000]
    collab: [10000, 150000]
  order_item_quantity_range: [1, 3]

data_quality_injection:
  # PRD 13.5. 원본(raw) 계층에만 적용하며 정제 데이터에는 반영하지 않는다.
  enabled: true
  duplicate_event_rate: 0.005
  missing_optional_field_rate: 0.01
  category_case_variation_rate: 0.005
  # 기본키 충돌, 존재하지 않는 외래키, 음수 금액 등 핵심 무결성 오류는
  # 이 설정으로 생성하지 않는다. 별도 오류 fixture에서만 사용한다.

output:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  sample_method: >
    무작위로 전체 행을 5%씩 뽑지 않는다. 먼저 dim_user에서 sample_size_fraction
    비율만큼 사용자를 무작위로 선정한 뒤, 해당 사용자와 관련된
    fact_user_event, fact_message_subscription, bridge_user_artist_follow,
    fact_order, fact_order_item 행만 함께 추출한다. dim_artist, dim_content,
    dim_product, dim_activity_phase, fact_artist_activity는 크기가 작으므로
    전량 포함한다.
  sample_size_fraction: 0.05
