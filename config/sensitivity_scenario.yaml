# FANLOG 순환 논리 방지용 비교 시나리오 설정 (PRD 13.4)
# data_generation.yaml과 별도로 관리하며, 기본 실행은 baseline을 사용한다.
# 비교 실험을 돌릴 때만 이 파일의 다른 시나리오로 덮어써서 재실행한다.

scenarios:
  - name: baseline
    communication_effect: 1.0
    description: >
      기본 시나리오. 아티스트 소통 빈도가 팬 활동에 실제로 영향을 준다고
      가정한다. 대시보드와 분석 보고서의 기본 결과는 이 시나리오로 생성한다.
  - name: null_effect
    communication_effect: 0.0
    description: >
      소통 효과를 완전히 제거한 비교 시나리오. 이 시나리오로 데이터를
      재생성했을 때도 분석 로직이 소통-활동 간 관계를 거짓으로 발견한다면,
      분석 방법론 자체에 문제가 있다는 뜻이다. 검증 목적으로만 사용하며
      대시보드 기본 결과에는 포함하지 않는다.

default_scenario: baseline
