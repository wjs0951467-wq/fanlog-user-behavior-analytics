services:
  postgres:
    image: postgres:16
    container_name: fanlog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - fanlog_pgdata:/var/lib/postgresql/data

volumes:
  fanlog_pgdata:
